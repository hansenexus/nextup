<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #0f0f0f; color: #ececec; } }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .bar h1 { font-size: 1.1rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #6b6b6b; }
  .bar .audience { font-size: 0.75rem; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; color: #b45309; }
  .bar .audience.is-public { color: #0e8a16; }
  .controls { display: flex; gap: 8px; }
  .controls button { font: inherit; font-size: 0.8rem; border: 1px solid #ccc; background: transparent; color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .controls button[aria-pressed="true"] { border-color: #1d76db; color: #1d76db; }
  nextup-roadmap { display: block; margin-bottom: 32px; }
  .empty { color: #6b6b6b; font-style: italic; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>Roadmap <span class="audience" data-audience="__AUDIENCE__">__AUDIENCE__</span></h1>
    <div class="controls" role="group" aria-label="language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
      <button type="button" data-view="phases" aria-pressed="true">phases</button>
      <button type="button" data-view="list" aria-pressed="false">list</button>
    </div>
  </div>
  <div id="roadmaps"><p class="empty">loading…</p></div>
</main>
<script src="./nextup-roadmap.iife.js"></script>
<script>
(function () {
  var audience = document.querySelector("[data-audience]");
  if (audience) audience.classList.add("is-" + audience.dataset.audience);
  var host = document.getElementById("roadmaps");
  var lang = (navigator.language || "en").slice(0, 2) === "de" ? "de" : "en";
  var view = "phases";
  function pressed(attr, value) {
    document.querySelectorAll("[" + attr + "]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute(attr) === value));
    });
  }
  function apply() {
    document.querySelectorAll("nextup-roadmap").forEach(function (el) {
      el.setAttribute("lang", lang);
      el.setAttribute("view", view);
    });
    pressed("data-lang", lang);
    pressed("data-view", view);
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.dataset.lang; apply(); });
  });
  document.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { view = b.dataset.view; apply(); });
  });
  fetch("./index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status + " index.json"); return r.json(); })
    .then(function (entries) {
      host.innerHTML = "";
      if (!entries.length) { host.innerHTML = '<p class="empty">no roadmaps</p>'; return; }
      entries.forEach(function (e) {
        var el = document.createElement("nextup-roadmap");
        el.setAttribute("src", "./" + e.path);
        el.setAttribute("lang", lang);
        el.setAttribute("view", view);
        el.id = e.project;
        host.appendChild(el);
      });
      apply();
    })
    .catch(function (e) { host.innerHTML = '<p class="empty">' + String(e).replace(/[<>&]/g, "") + "</p>"; });
})();
</script>
</body>
</html>
