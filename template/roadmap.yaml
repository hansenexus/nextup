# yaml-language-server: $schema=https://nextup.hansenexus.dev/schema/roadmap.schema.json
#
# roadmap.yaml — what this project is doing, in what order, and how far along.
#
#   phases      ORDERED. The container for time. A phase may name a quarter
#               (`target: 2026-Q4`) and nothing finer.
#   items       The roadmap. `phase` says when, `visibility` says who may see
#               it, `tasks` are what `nextup dispatch` turns into issues.
#   milestones  The only place a day-date may appear, and only with `source`.
#
# Status is DERIVED once an item has issues: closed issues → done, open and
# labelled in-progress → in progress. Write `status:` only on items nothing is
# linked to yet, and say `since:` when.
#
#   nextup validate      check this file
#   nextup status        roll status up from GitHub
#   nextup next          what is dispatchable now
#   nextup dispatch <id> open issues for an item's tasks (dry run; --apply to do it)
#   nextup build --site  static page + roadmap.public.json

schema: 1
meta:
  project: __PROJECT__
  repo: __REPO__
  title: __PROJECT__
  locales: [en]
  version: 1
  updated: __TODAY__
  public: false          # flip to true when the public projection may be published
  current_phase: __FIRST_PHASE__

phases:
__PHASES__

items:
  - id: __FIRST_PHASE_LOWER__-first-slice
    title: First vertical slice
    summary: The smallest thing that can be used end to end.
    phase: __FIRST_PHASE__
    visibility: public
    status: proposed
    since: __TODAY__
    tasks:
      - id: tracer
        title: Tracer bullet through every layer
        acceptance:
          - One request travels through every layer and comes back
        verify:
          - echo "replace with the real check"

milestones: []
